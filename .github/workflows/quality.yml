name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ inputs.source_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-format-and-docs:
    name: Rust format, docs, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --doc --workspace --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - run: cargo package -p zirium --locked

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --locked --no-sync ruff format --check python
      - run: uv run --locked --no-sync ruff check python
      - run: uv run --locked --no-sync ty check python
      - run: uv run --locked --no-sync pytest -q
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: x86_64-unknown-linux-gnu
          manylinux: "2014"
          args: >-
            --release --locked --compatibility pypi
            --interpreter python${{ matrix.python-version }} --out dist
      - run: uv run --locked --no-sync twine check dist/*.whl
      - run: >-
          uv run --locked --no-sync python -c
          'import glob; wheels=glob.glob("dist/*.whl"); assert len(wheels) == 1; assert "manylinux" in wheels[0]; assert "abi3" not in wheels[0]'
      - run: uv venv --python ${{ matrix.python-version }} wheel-venv
      - run: uv pip install --python wheel-venv/bin/python dist/*.whl
      - run: >-
          wheel-venv/bin/python -c
          'import zirium; d=zirium.parse_text("\"test\"() : () -> ()").lower_strict().document; assert d.operation_table().count == 1; assert d.canonical_bytes()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-wheel-cp${{ matrix.python-version }}-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  macos-wheel:
    name: macOS arm64 wheel CPython ${{ matrix.python-version }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: test "$(uname -m)" = arm64
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: >-
          uv run --locked --no-sync maturin build --release --locked
          --target aarch64-apple-darwin
          --interpreter .venv/bin/python --out dist
      - run: uv run --locked --no-sync twine check dist/*.whl
      - name: Check and install the wheel
        shell: bash
        run: |
          set -eu
          python_tag="cp${{ matrix.python-version }}"
          python_tag="${python_tag/./}"
          wheel=$(find dist -maxdepth 1 -name "zirium-*-${python_tag}-${python_tag}-*macosx*_arm64.whl" -print -quit)
          test -n "$wheel"
          case "$wheel" in
            *abi3*) echo "unexpected stable-ABI wheel: $wheel" >&2; exit 1 ;;
          esac
          uv venv --python "${{ matrix.python-version }}" wheel-venv
          uv pip install --python wheel-venv/bin/python "$wheel"
          wheel-venv/bin/python -c \
            'import zirium; d=zirium.parse_text("\"test\"() : () -> ()").lower_strict().document; assert d is not None; assert d.operation_table().count == 1; assert d.canonical_bytes()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-wheel-cp${{ matrix.python-version }}-macos-arm64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.14
      - run: uv sync --locked --python 3.14
      - run: uv build --sdist --python .venv/bin/python --out-dir dist --clear
      - run: uv run --locked --no-sync twine check dist/*.tar.gz
      - name: Check and install the source distribution
        shell: bash
        run: |
          set -eu
          archive=$(find dist -maxdepth 1 -name 'zirium-*.tar.gz' -print -quit)
          test -n "$archive"
          tar -tzf "$archive" | grep '/LICENSE-APACHE$'
          tar -tzf "$archive" | grep '/LICENSE-MIT$'
          uv venv --python 3.14 sdist-venv
          uv pip install --python sdist-venv/bin/python "$archive"
          sdist-venv/bin/python -c \
            'import zirium; d=zirium.parse_text("\"test\"() : () -> ()").lower_strict().document; assert d.operation_table().count == 1; assert d.canonical_bytes()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
