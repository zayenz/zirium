name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-format-and-docs:
    name: Rust format and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - run: cargo package -p zirium --locked

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }} .venv
      - run: uv pip install --python .venv/bin/python maturin pytest ruff twine ty
      - run: VIRTUAL_ENV=.venv .venv/bin/maturin develop --uv
      - run: .venv/bin/ruff format --check python
      - run: .venv/bin/ruff check python
      - run: .venv/bin/ty check python
      - run: .venv/bin/pytest -q
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: x86_64-unknown-linux-gnu
          manylinux: "2014"
          args: >-
            --release --locked --compatibility pypi
            --interpreter python${{ matrix.python-version }} --out dist
      - run: .venv/bin/twine check dist/*.whl
      - run: >-
          .venv/bin/python -c
          'import glob; wheels=glob.glob("dist/*.whl"); assert len(wheels) == 1; assert "manylinux" in wheels[0]; assert "abi3" not in wheels[0]'
      - run: uv venv --python ${{ matrix.python-version }} wheel-venv
      - run: uv pip install --python wheel-venv/bin/python dist/*.whl
      - run: >-
          wheel-venv/bin/python -c
          'import zirium; d=zirium.parse_text("\"test\"() : () -> ()").lower_strict().document; assert d.operation_table().count == 1; assert d.canonical_bytes()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-cp${{ matrix.python-version }}-linux-x86_64
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.14
      - run: uv venv --python 3.14 .venv
      - run: uv pip install --python .venv/bin/python twine
      - run: uv build --sdist --python .venv/bin/python --out-dir dist-one --clear
      - run: uv build --sdist --python .venv/bin/python --out-dir dist-two --clear
      - run: .venv/bin/twine check dist-one/* dist-two/*
      - run: uv venv --python 3.14 sdist-venv
      - run: uv pip install --python sdist-venv/bin/python dist-two/*.tar.gz
      - run: >-
          sdist-venv/bin/python -c
          'import zirium; d=zirium.parse_text("\"test\"() : () -> ()").lower_strict().document; assert d.operation_table().count == 1; assert d.canonical_bytes()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist-two/*.tar.gz
