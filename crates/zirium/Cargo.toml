[package]
name = "zirium"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lossless textual MLIR syntax parsing and semantic processing"
repository = "https://github.com/zayenz/zirium"
readme = "../../README.md"
homepage = "https://zayenz.se/zirium/"
documentation = "https://docs.rs/zirium"
keywords = ["mlir", "parser", "compiler"]
categories = ["parser-implementations", "compilers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zirql = { git = "https://github.com/zayenz/zirql", rev = "93db6273ba6d94ab94eef9e2666a44c5cc2ae62e", version = "=0.1.0-alpha.5" }
