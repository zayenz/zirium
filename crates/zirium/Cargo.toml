[package]
name = "zirium"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lossless textual MLIR syntax parsing and semantic processing"
repository = "https://github.com/zayenz/zirium"
readme = "../../README.md"
homepage = "https://zayenz.se/zirium/"
documentation = "https://docs.rs/zirium"
keywords = ["mlir", "parser", "compiler"]
categories = ["parser-implementations", "compilers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zirql = { git = "https://github.com/zayenz/zirql", rev = "3ad644d7a53de560cb08b2ec399a475d14e116f4", version = "=0.1.0-alpha.5" }
