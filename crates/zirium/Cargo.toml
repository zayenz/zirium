[package]
name = "zirium"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lossless textual MLIR syntax parsing and semantic processing"
repository = "https://github.com/zayenz/zirium"
readme = "../../README.md"
homepage = "https://zayenz.se/zirium/"
documentation = "https://docs.rs/zirium/0.5.0/zirium/"
keywords = ["mlir", "parser", "compiler"]
categories = ["parser-implementations", "compilers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zirql = { git = "https://github.com/zayenz/zirql", rev = "860247d1cc703d058979d39344c72d7e669092ce", version = "=0.1.0" }
